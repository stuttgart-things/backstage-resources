---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
spec:
  memberOf: [guests]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: patrick-hermann-sva
spec:
  memberOf: [guests]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: sina-schlatter
spec:
  memberOf: [guests]
---
# A developer: in guests, not in platform-team. The sthings-backstage permission
# policy therefore shows Martwol only templates annotated
# backstage.stuttgart-things.com/audience: developers (request-vm).
# The name must be the GitHub login -- sign-in resolves users by it.
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: Martwol
spec:
  memberOf: [guests]
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: guests
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: Platform Engineering Team
spec:
  type: team
  children: [team-infrastructure]
  members:
    - patrick-hermann-sva
    - sina-schlatter
---
# Owner of the stuttgart-things templates (backstage/templates/*) and the
# Terraform VMs. Without it, their spec.owner pointed at nothing here.
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: team-infrastructure
  description: Infrastructure -- owner of the stuttgart-things templates and VMs
spec:
  type: team
  parent: platform-team
  children: []
  members:
    - patrick-hermann-sva
    - sina-schlatter
---
# Groups granted by Zitadel roles (sthings-backstage resolver, docs/zitadel.md):
# the role decides who is a member, not this file -- so no members here. The
# entities exist so that an order owned by the group, or a user's group on
# /settings, links to something instead of "Entities not found".
#   backstage-beta-<track> -> group:default/beta-<track>
#   backstage-team-<team>  -> group:default/<team>
# (stuttgart-things/stuttgart-things#4276)
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: beta-vm-machinery
  description: >-
    Beta testers of the vm-machinery track -- order, resize and delete a VM on
    machinery. Members come from the Zitadel role backstage-beta-vm-machinery.
spec:
  type: beta-track
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: hill-valley
  description: >-
    Test team that can own orders. Members come from the Zitadel role
    backstage-team-hill-valley.
spec:
  type: team
  children: []
