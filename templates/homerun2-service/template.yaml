---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: homerun2-service
  title: "[worker] Homerun2 Service"
  description: >-
    Started by the Dapr worker from request-homerun2-service -- do not run by hand
    except to recover a run. Scaffold a new homerun2 microservice (pitcher or catcher)
  tags:
    - golang
    - redis
    - homerun2
    - microservice
spec:
  owner: platform-team
  # Run by the Dapr worker from request-homerun2-service
  # (stuttgart-things backstage/templates): the request pull request is the
  # approval, merged by platform; the worker then runs this template with its
  # service token. The repository is created with Backstage's GitHub
  # integration (no user token under the worker -- publish:github falls back),
  # and the catalog entry comes from the Location file the request PR adds,
  # so there is no catalog:register here: developers may not register
  # entities (sthings-backstage docs/permissions.md).
  type: worker-step

  parameters:
    - title: Service Information
      required:
        - repoUrl
        - serviceName
        - serviceType
        - description
        - owner
      properties:
        repoUrl:
          title: Repository Location
          type: string
          description: The repository name will be used as the service name
          ui:field: RepoUrlPicker
          ui:autofocus: true
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - stuttgart-things
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN # pragma: allowlist secret
              additionalScopes:
                github:
                  - workflow

        serviceName:
          title: Service Name
          type: string
          description: "Name suffix WITHOUT homerun2- prefix (e.g., core-catcher, omni-pitcher, k8s-pitcher). Repo will be homerun2-<name>."
          pattern: "^[a-z][a-z0-9-]+$"

        serviceType:
          title: Service Type
          type: string
          description: Type of homerun2 service to create
          enum:
            - pitcher
            - catcher
          enumNames:
            - Pitcher (HTTP API → Redis Streams producer)
            - Catcher (Redis Streams consumer → processor)

        description:
          title: Description
          type: string
          description: A brief description of the service

        owner:
          title: Owner
          type: string
          description: Owner of the service
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

        requestedBy:
          title: Requested by
          type: string
          description: >-
            Set by the request template (the user who asked); becomes the
            backstage.stuttgart-things.com/requested-by annotation.
          ui:widget: hidden
    - title: Redis Configuration
      properties:
        redisStream:
          title: Redis Stream Name
          type: string
          default: messages
          description: Name of the Redis stream to produce to or consume from

        consumerGroup:
          title: Consumer Group Name
          type: string
          description: Consumer group name (catcher only, defaults to service name)

    - title: Repository Configuration
      properties:
        visibility:
          title: Repository Visibility
          type: string
          default: public
          enum:
            - public
            - private
          enumNames:
            - Public
            - Private

        repoTags:
          title: Repository Tags
          type: array
          description: Tags/topics for the GitHub repository
          items:
            type: string
          ui:options:
            addable: true
            orderable: false
            removable: true

  steps:
    - id: fetch-skeleton
      name: Fetch Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          serviceName: ${{ parameters.serviceName }}
          serviceType: ${{ parameters.serviceType }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          redisStream: ${{ parameters.redisStream or 'messages' }}
          consumerGroup: ${{ parameters.consumerGroup or 'homerun2-' + parameters.serviceName }}
          orgName: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          fullName: homerun2-${{ parameters.serviceName }}
          goModule: github.com/${{ (parameters.repoUrl | parseRepoUrl).owner }}/homerun2-${{ parameters.serviceName }}
          repoOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          requestedBy: ${{ parameters.requestedBy }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        repoVisibility: ${{ parameters.visibility }}
        defaultBranch: main
        token: ${{ secrets.USER_OAUTH_TOKEN }}
        topics: ${{ parameters.repoTags }}

  output:
    links:
      - title: Repository
        icon: github
        url: ${{ steps['publish'].output.remoteUrl }}
    text:
      - title: Repository Created
        content: |
          Your new homerun2 service has been created at:
          ${{ steps['publish'].output.remoteUrl }}
      - title: Next Steps
        content: |
          1. Clone the repository: `git clone ${{ steps['publish'].output.remoteUrl }}`
          2. Run `go mod tidy` to install dependencies
          3. Run `task --list` to see available tasks
          4. Start developing your service!
