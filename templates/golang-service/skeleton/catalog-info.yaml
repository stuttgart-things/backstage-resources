---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description | dump }}
  annotations:
{%- if values.requestedBy %}
    backstage.stuttgart-things.com/requested-by: ${{ values.requestedBy }}
{%- endif %}
    github.com/project-slug: ${{ values.repoOwner }}/${{ values.repoName }}
    backstage.io/techdocs-ref: dir:.
  tags:
    - golang
    - service
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
