---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: golang-service
  title: "[worker] Go Service"
  description: >-
    Started by the Dapr worker from request-go-service -- do not run by hand
    except to recover a run. Create a new Go service with GitHub repository, Taskfile, and basic project structure
  tags:
    - golang
    - service
    - recommended
spec:
  owner: platform-team
  # Run by the Dapr worker from request-go-service
  # (stuttgart-things backstage/templates): the request pull request is the
  # approval, merged by platform; the worker then runs this template with its
  # service token. The repository is created with Backstage's GitHub
  # integration (no user token under the worker -- publish:github falls back),
  # and the catalog entry comes from the Location file the request PR adds,
  # so there is no catalog:register here: developers may not register
  # entities (sthings-backstage docs/permissions.md).
  type: worker-step

  parameters:
    - title: Service Information
      required:
        - repoUrl
        - description
        - owner
      properties:
        repoUrl:
          title: Repository Location
          type: string
          description: The repository name will be used as the service name
          ui:field: RepoUrlPicker
          ui:autofocus: true
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - stuttgart-things
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN # pragma: allowlist secret
              additionalScopes:
                github:
                  - workflow

        description:
          title: Description
          type: string
          description: A brief description of the service

        owner:
          title: Owner
          type: string
          description: Owner of the service
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

        requestedBy:
          title: Requested by
          type: string
          description: >-
            Set by the request template (the user who asked); becomes the
            backstage.stuttgart-things.com/requested-by annotation.
          ui:widget: hidden
    - title: Repository Configuration
      properties:
        visibility:
          title: Repository Visibility
          type: string
          default: public
          enum:
            - public
            - private
          enumNames:
            - Public
            - Private

        repoTags:
          title: Repository Tags
          type: array
          description: Tags/topics for the GitHub repository (e.g., golang, microservice)
          items:
            type: string
          ui:options:
            addable: true
            orderable: false
            removable: true

    - title: Go Configuration
      properties:
        goModule:
          title: Go Module Path
          type: string
          description: "Go module path (e.g., github.com/org/repo). Leave empty to auto-generate."

        goVersion:
          title: Go Version
          type: string
          default: "1.26"
          enum:
            - "1.26"
            - "1.25.6"
            - "1.24.12"
          enumNames:
            - "1.26 (Latest)"
            - "1.25.6"
            - "1.24.12"

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          goModule: ${{ parameters.goModule or 'github.com/' + (parameters.repoUrl | parseRepoUrl).owner + '/' + (parameters.repoUrl | parseRepoUrl).repo }}
          goVersion: ${{ parameters.goVersion }}
          repoUrl: ${{ parameters.repoUrl }}
          repoOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          requestedBy: ${{ parameters.requestedBy }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        repoVisibility: ${{ parameters.visibility }}
        defaultBranch: main
        token: ${{ secrets.USER_OAUTH_TOKEN }}
        topics: ${{ parameters.repoTags }}

  output:
    links:
      - title: Repository
        icon: github
        url: ${{ steps['publish'].output.remoteUrl }}
    text:
      - title: Repository Created
        content: |
          Your new Go service repository has been created at:
          ${{ steps['publish'].output.remoteUrl }}
      - title: Next Steps
        content: |
          1. Clone the repository: `git clone ${{ steps['publish'].output.remoteUrl }}`
          2. Run `go mod tidy` to install dependencies
          3. Run `task --list` to see available tasks
          4. Start developing your service!
